# Display panes until user selects one
bind q display-panes -d 0

# Start windows at index 1
set -g base-index 1

# Use tmux terminfo when available, with a portable fallback.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'

set-option -sa terminal-features ',xterm*:RGB'

